name = "zyphix"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/fonts/*", "!/images/*", "!/videos/*", "!/og/*", "!/favicon.svg", "!/favicon.ico", "!/manifest.webmanifest", "!/sw.js", "!/googlec384b4902726d1d1.html"]

[[d1_databases]]
binding = "DB"
database_name = "zyphix-catalog"
database_id = "8ed1c8d8-3bea-47ea-83f9-87482705c5c7"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "zyphix-images"

[ai]
binding = "AI"

[observability]
enabled = true

# Image pipeline runs itself: every 2 minutes resolve a few product photos, generate produce shots, build thumbnails
[triggers]
crons = ["*/2 * * * *"]
