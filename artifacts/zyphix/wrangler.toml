# Zyphix Now – Cloudflare Worker + static assets (Vite build)
# Deploy:  pnpm cf:deploy      (see DEPLOY.md)
name = "zyphix"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain – uncomment once zyphix.in is on this Cloudflare account
# routes = [
#   { pattern = "zyphix.in", custom_domain = true },
#   { pattern = "www.zyphix.in", custom_domain = true },
# ]

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "zyphix-catalog"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "zyphix-images"

[ai]
binding = "AI"

[vars]
# PUBLIC_IMAGE_BASE = "https://zyphix.in"   # only needed if the API is served from a different origin than the images

[observability]
enabled = true
